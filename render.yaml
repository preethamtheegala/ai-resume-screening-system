services:
  - type: web
    name: ai-resume-screening-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: ai_resume_screening
      - key: RESEND_API_KEY
        sync: false
